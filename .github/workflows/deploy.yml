name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.8.5'
  PROJECT:    bgs-hello

jobs:
  build-push:
    name: Build + push image to ECR
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image URI
        id: image
        run: |
          echo "image_uri=${{ steps.ecr.outputs.registry }}/${PROJECT}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA} \
            -t "${{ steps.image.outputs.image_uri }}" \
            .

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image
        run: docker push "${{ steps.image.outputs.image_uri }}"

  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: build-push
    environment: prod
    outputs:
      service_url: ${{ steps.output.outputs.service_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: tf init
        run: |
          terraform -chdir=terraform/app init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=bgs-hello/app/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: tf apply
        run: |
          terraform -chdir=terraform/app apply -auto-approve \
            -var "image_uri=${{ needs.build-push.outputs.image_uri }}"

      - name: Export service URL
        id: output
        run: |
          url=$(terraform -chdir=terraform/app output -raw service_url)
          echo "service_url=$url" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Wait for ALB + hit healthz
        env:
          URL: ${{ needs.terraform-apply.outputs.service_url }}
        run: |
          set -euo pipefail
          echo "Probing $URL/healthz"
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 5 "$URL/healthz" || echo "000")
            if [[ "$code" == "200" ]]; then
              echo "healthz ok on attempt $i:"
              cat /tmp/body; echo
              exit 0
            fi
            echo "attempt $i: HTTP $code, sleeping"
            sleep 10
          done
          echo "Smoke test failed: healthz never returned 200"
          exit 1

      - name: Rollback note
        if: failure()
        run: |
          echo "::warning::Deploy failed smoke test. Roll back by re-running"
          echo "::warning::the previous successful deploy workflow, or manually:"
          echo "::warning::  aws ecs update-service --cluster bgs-hello-dev \\"
          echo "::warning::    --service bgs-hello-dev --task-definition <previous-revision>"
